<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Quiz ❤️</title>

<style>
:root {
  --bg: #fff5f8;
  --pink: #ff5d8f;
  --rose: #ff8fab;
  --deep: #8b1e3f;
  --text: #4a1d2f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
  background:linear-gradient(135deg,var(--bg),#ffe7ef);
  display:grid;
  place-items:center;
  min-height:100vh;
  padding:20px;
}

.quiz-card{
  width:min(92vw,620px);
  background:white;
  border-radius:25px;
  padding:25px;
  text-align:center;
  box-shadow:0 15px 35px rgba(0,0,0,.15);
}

h1{
  color:var(--deep);
  margin-bottom:10px;
}

.subtitle{
  color:#555;
  margin-bottom:20px;
}

.progress{
  color:var(--pink);
  font-weight:bold;
  margin-bottom:15px;
}

.question{
  font-size:22px;
  color:var(--deep);
  margin-bottom:20px;
  font-weight:bold;
}

.options{
  display:grid;
  gap:12px;
  margin-bottom:20px;
}

.option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
  border:1px solid #ffd1df;
  border-radius:50px;
  cursor:pointer;
  background:#fff;
  transition:.3s;
}

.option:hover{
  background:#fff2f6;
}

button{
  padding:12px 28px;
  border:none;
  border-radius:50px;
  background:linear-gradient(135deg,var(--pink),var(--rose));
  color:white;
  font-size:17px;
  cursor:pointer;
}

.result{
  margin-top:20px;
  font-size:18px;
  color:var(--deep);
  font-weight:bold;
}

.romantic-card{
  background:#fff5f8;
  border-radius:20px;
  padding:20px;
  animation:pop .5s;
}

.emoji-row{
  font-size:35px;
}

.mini-hearts{
  font-size:22px;
}

@keyframes pop{
  from{
    transform:scale(.8);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}
</style>

</head>
<body>

<div class="quiz-card">

<h1>This Questions For You Babzz ❤️</h1>
<p class="subtitle">Unmaya Pathil Sollu 💖</p>

<div class="progress" id="progress"></div>

<div class="question" id="question"></div>

<div class="options" id="options"></div>

<button id="nextBtn">Next</button>

<div class="result" id="result"></div>

</div>

<script>

const questions = [

{
text:"Do you love me?",
options:["Yes ❤️","No 💔"]
},

{
text:"What do you love most about me?",
options:[
"My Eyes 👀",
"My Heart ❤️",
"My Silly Side 😂",
"Everything 🥰"
]
},

{
text:"Which place would you love to visit with me?",
options:[
"Beach 🌊",
"Un Veedu 🏠",
"En Veedu 🏡",
"Bharathi Park 🌳"
]
},

{
text:"What makes our bond special?",
options:[
"Laughing Together 😂",
"Being There For Each Other ❤️",
"Cute Little Moments 🥹",
"All Of These 💖"
]
},

{
text:"What should I do for you today?",
options:[
"Singing Video 🎤",
"3 New Pics 📸",
"Kiss Video 😘",
"Dancing Video 💃"
]
}

];

let currentQuestion=0;
let answers=[];

const progress=document.getElementById("progress");
const question=document.getElementById("question");
const options=document.getElementById("options");
const nextBtn=document.getElementById("nextBtn");
const result=document.getElementById("result");

function renderQuestion(){

progress.innerHTML=`Question ${currentQuestion+1} of ${questions.length}`;

question.innerHTML=questions[currentQuestion].text;

options.innerHTML="";

result.innerHTML="";

questions[currentQuestion].options.forEach(option=>{

const label=document.createElement("label");

label.className="option";

label.innerHTML=`
<input type="radio" name="answer" value="${option}">
<span>${option}</span>
`;

options.appendChild(label);

});

nextBtn.innerHTML=currentQuestion==questions.length-1?"Finish":"Next";

}

nextBtn.addEventListener("click", () => {

  const selected = document.querySelector("input[name='answer']:checked");

  if (!selected) {
    result.innerHTML = "🥺 First option ah choose pannu da!";
    return;
  }

  answers[currentQuestion] = selected.value;

  // Messages for every option
  const messages = [

    // Question 1
    {
      "Yes ❤️": "🥹❤️ I Love You Too Daaaa Babzz 😘💕",
      "No 💔": "😒 No ah? Poi thirumba YES nu select pannitu va 😂❤️"
    },

    // Question 2
    {
      "My Eyes 👀": "🙈 Awww... En eyes ah romba pidikuma? ❤️",
      "My Heart ❤️": "🥹 Nee romba sweet da... Love you! 💖",
      "My Silly Side 😂": "😂 Enna kalaikuradha than unaku pudikuma?",
      "Everything 🥰": "🥺❤️ Awwww... Nee than en ulagam!"
    },

    // Question 3
    {
      "Beach 🌊": "🌊 Sunset paathu rendu perum walk polaam ❤️",
      "Un Veedu 🏠": "🤭 Un veetuku vandha enna treat? 😂",
      "En Veedu 🏡": "🥰 Amma sapadu ready pannirupanga ❤️",
      "Bharathi Park 🌳": "🌳 Anga ukkanthu neraya pesalaam 💕"
    },

    // Question 4
    {
      "Laughing Together 😂": "😂 Un sirippu dhan en happiness ❤️",
      "Being There For Each Other ❤️": "🥹 Always irupom together 💖",
      "Cute Little Moments 🥰": "🥺 Chinna chinna memories dhan life ❤️",
      "All Of These 💖": "😍 Correct answer da Babzz!"
    },

    // Question 5
    {
      "Singing Video 🎤": "🎤 Okay Babzz... Song ready pannuren ❤️",
      "3 New Pics 📸": "📸 Seri... Super pics anupuren 😘",
      "Kiss Video 😘": "🙈 Ayyo... Romba naughty da nee 😂❤️",
      "Dancing Video 💃": "💃 Dance practice start panniten 😂💕"
    }

  ];

  result.innerHTML = messages[currentQuestion][selected.value];

  currentQuestion++;

  setTimeout(() => {

    if (currentQuestion < questions.length) {
      renderQuestion();
    } else {

      progress.innerHTML = "Finished ❤️";
      question.innerHTML = "💖 My Sweet Little Love 💖";
      options.innerHTML = "";
      nextBtn.style.display = "none";

      result.innerHTML = `
      <div class="romantic-card">
        <div class="emoji-row">🥰 ❤️ 🌹 💕</div>
        <h2>Thank You Babzz 😘</h2>
        <p>
        Thanks for answering all my questions ❤️<br><br>
        I Love You Forever 💖
        </p>
        <div class="mini-hearts">❤️ 💕 ❤️ 💕 ❤️</div>
      </div>`;
    }

  }, 2000);

});



renderQuestion();

</script>

</body>
</html>
